<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>🎃 Álbum de Halloween</title>
  <style>
    :root {
      --bg: #0d0d11;
      --card: #181820;
      --accent: #ff6600;
      --text: #f0f0f5;
      --muted: #9a9aa6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      padding: 20px 15px 50px;
      text-align: center;
    }
    .container {
      max-width: 500px;
      margin: 0 auto;
    }
    .header {
      background: var(--card);
      border: 2px solid var(--accent);
      border-radius: 20px;
      padding: 25px 20px;
      box-shadow: 0 8px 25px rgba(255, 102, 0, 0.15);
      margin-bottom: 25px;
    }
    h1 {
      font-size: 26px;
      color: var(--accent);
      margin-bottom: 6px;
    }
    p.sub {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 18px;
    }
    .name-input {
      width: 100%;
      background: #101016;
      border: 1px solid #3f3f52;
      color: var(--text);
      padding: 12px 15px;
      border-radius: 12px;
      font-size: 15px;
      margin-bottom: 14px;
      outline: none;
      text-align: center;
      transition: border-color 0.2s;
    }
    .name-input:focus {
      border-color: var(--accent);
    }
    input[type="file"] { display: none; }
    .btn-group {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      background: var(--accent);
      color: #000;
      font-weight: 800;
      font-size: 15px;
      padding: 14px 20px;
      border-radius: 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex: 1;
      min-width: 140px;
      transition: transform 0.1s;
      user-select: none;
    }
    .btn:active { transform: scale(0.97); }
    .btn.secondary {
      background: #2b2b38;
      color: var(--text);
      border: 1px solid #3f3f52;
    }
    #status {
      margin-top: 16px;
      font-size: 14px;
      font-weight: 600;
      min-height: 20px;
      word-break: break-word;
    }
    .progress-bar {
      width: 100%;
      height: 8px;
      background: #2b2b38;
      border-radius: 10px;
      margin-top: 10px;
      overflow: hidden;
      display: none;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width 0.3s;
    }
    .gallery-title {
      font-size: 18px;
      margin: 25px 0 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--text);
    }
    .refresh-btn {
      background: none;
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .grid-item {
      aspect-ratio: 1 / 1;
      background: var(--card);
      border-radius: 10px;
      overflow: hidden;
      position: relative;
      border: 1px solid #282834;
      cursor: pointer;
    }
    .grid-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .author-badge {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(transparent, rgba(0, 0, 0, 0.85));
      color: #fff;
      font-size: 11px;
      padding: 12px 6px 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: center;
      font-weight: 600;
    }
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      z-index: 999;
      align-items: center;
      justify-content: center;
      padding: 15px;
      flex-direction: column;
    }
    .modal img {
      max-width: 100%;
      max-height: 75vh;
      border-radius: 12px;
      border: 2px solid var(--accent);
    }
    .modal-author {
      margin-top: 12px;
      color: var(--text);
      font-size: 16px;
      font-weight: bold;
    }
    .close-modal {
      margin-top: 14px;
      background: var(--accent);
      color: #000;
      border: none;
      padding: 10px 24px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>🎃 Halloween Party 🎃</h1>
      <p class="sub">¡Sube tus fotos al álbum compartido de la fiesta!</p>

      <input type="text" id="guestName" class="name-input" placeholder="Tu nombre o apodo (opcional) 🧛‍♂️" maxlength="25">

      <div class="btn-group">
        <label class="btn" for="galleryInput">
          🖼️ Elegir Fotos
        </label>
        <input type="file" id="galleryInput" accept="image/*" multiple onchange="processFiles(this)">

        <label class="btn secondary" for="cameraInput">
          📸 Tomar Foto
        </label>
        <input type="file" id="cameraInput" accept="image/*" capture="environment" onchange="processFiles(this)">
      </div>

      <div id="status"></div>
      <div class="progress-bar" id="progressBar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>

    <div class="gallery-title">
      <span>👻 Fotos de la noche (<span id="photoCount">0</span>)</span>
      <button class="refresh-btn" onclick="loadGallery()">🔄 Actualizar</button>
    </div>

    <div class="grid" id="galleryGrid"></div>
  </div>

  <div class="modal" id="photoModal" onclick="closeModal()">
    <img id="modalImg" src="">
    <div class="modal-author" id="modalAuthor"></div>
    <button class="close-modal">Cerrar</button>
  </div>

  <script>
    // NUEVO ID Y URL DE IMPLEMENTACIÓN INTEGRADOS
    const DEPLOYMENT_ID = "AKfycbzyYj7LAgxpP3vA5xoJQQpotsSN9aLfUxL5l22IKofJTA5kVDFTv8a1HpVLz51Gc3BN";
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzyYj7LAgxpP3vA5xoJQQpotsSN9aLfUxL5l22IKofJTA5kVDFTv8a1HpVLz51Gc3BN/exec";
    const FOLDER_ID = "1mYvL_sn7l3_APuNl20m6-u5LLeLuBTR6";

    window.onload = () => {
      const savedName = localStorage.getItem('halloween_guest_name');
      if (savedName) {
        document.getElementById('guestName').value = savedName;
      }
      loadGallery();
    };

    document.getElementById('guestName').addEventListener('input', (e) => {
      localStorage.setItem('halloween_guest_name', e.target.value);
    });

    function compressImage(file, maxWidth = 1600, quality = 0.82) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onerror = (err) => reject(err);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onerror = (err) => reject(err);
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;

            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            const dataUrl = canvas.toDataURL('image/jpeg', quality);
            resolve(dataUrl.split(',')[1]);
          };
        };
      });
    }

    async function processFiles(inputElement) {
      const fileList = inputElement.files;
      if (!fileList || fileList.length === 0) return;
      const files = Array.from(fileList);
      const status = document.getElementById('status');
      const bar = document.getElementById('progressBar');
      const fill = document.getElementById('progressFill');
      
      const rawName = document.getElementById('guestName').value.trim();
      const authorName = rawName !== "" ? rawName : "Anónimo 👻";
      const safeNameForFile = rawName !== "" ? rawName.replace(/[^a-zA-Z0-9_-]/g, '') : "Invitado";

      bar.style.display = 'block';
      fill.style.width = '10%';

      let uploaded = 0;
      let lastError = "";

      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        status.innerText = `Procesando y subiendo foto ${i + 1} de ${files.length}... 🦇`;

        try {
          const base64 = await compressImage(file);
          const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
          const cleanName = `${safeNameForFile}_${timestamp}_${i + 1}.jpg`;

          const response = await fetch(SCRIPT_URL, {
            method: 'POST',
            redirect: 'follow',
            body: JSON.stringify({
              base64Data: base64,
              filename: cleanName,
              mimeType: 'image/jpeg',
              author: authorName,
              folderId: FOLDER_ID
            })
          });

          const textRes = await response.text();
          try {
            const res = JSON.parse(textRes);
            if (res && res.success) {
              uploaded++;
            } else {
              lastError = res.error || "Respuesta sin éxito del script";
            }
          } catch (jsonErr) {
            lastError = "Verifica que en Apps Script el acceso diga 'Cualquier usuario'.";
          }

          fill.style.width = `${Math.round(((i + 1) / files.length) * 100)}%`;
        } catch (err) {
          console.error("Error subiendo foto:", err);
          lastError = err.message;
        }
      }

      // Limpiamos el selector para permitir subir otra foto seguida sin recargar
      inputElement.value = "";

      if (uploaded > 0) {
        status.innerText = `¡Listo! Se subieron ${uploaded} foto(s) 🎃`;
      } else {
        status.innerText = `⚠️ No se pudo subir: ${lastError}`;
      }

      setTimeout(() => { bar.style.display = 'none'; }, 2000);
      loadGallery();
    }

    async function loadGallery() {
      const grid = document.getElementById('galleryGrid');
      try {
        const response = await fetch(`${SCRIPT_URL}?action=getPhotos`, {
          method: 'GET',
          redirect: 'follow'
        });
        const photos = await response.json();

        document.getElementById('photoCount').innerText = photos.length;
        grid.innerHTML = '';

        photos.forEach(p => {
          const div = document.createElement('div');
          div.className = 'grid-item';
          const thumbUrl = `https://drive.google.com/thumbnail?id=${p.id}&sz=w500`;
          const fullUrl = `https://drive.google.com/thumbnail?id=${p.id}&sz=w1600`;
          
          const img = document.createElement('img');
          img.src = thumbUrl;
          img.loading = 'lazy';
          
          const badge = document.createElement('div');
          badge.className = 'author-badge';
          badge.innerText = `📸 ${p.author}`;
          
          div.onclick = () => openModal(fullUrl, p.author);
          div.appendChild(img);
          div.appendChild(badge);
          grid.appendChild(div);
        });
      } catch (err) {
        console.error("Error cargando galería:", err);
      }
    }

    function openModal(url, author) {
      document.getElementById('modalImg').src = url;
      document.getElementById('modalAuthor').innerText = `Subida por: ${author}`;
      document.getElementById('photoModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('photoModal').style.display = 'none';
      document.getElementById('modalImg').src = '';
    }
  </script>
</body>
</html>
